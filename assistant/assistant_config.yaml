# ================= 系统级配置 =================
system:
  memory_enabled: true   # 开启长期记忆 (Agent 会自动使用 save_memory/search_memory)
  timezone: "Asia/Shanghai"

# ================= 模型配置 =================
provider:
  llm:
    provider: "openai"
    config:
      # === 连接配置（构造参数）===
      model_name: "qwen3_vl"
      base_url: 'http://192.168.10.180:8088/v1'  # Provider 会自动处理末尾 /
      api_key_env: "OPENAI_API_KEY"
      timeout: 120.0
      max_retries: 5

      # === 推理配置（运行时参数）===
      temperature: 0.7
      max_tokens: null  # null = 使用模型默认值
      top_p: null
      frequency_penalty: null
      presence_penalty: null

  embedding:
    provider: "openai_embedding"
    config:
      base_url: http://192.168.10.137:8002

  reranker:
    provider: "openai"
    config:
      type: "openai"
      base_url: "http://192.168.10.137:8079"
      top_k: 5
      batch_size: 32
      route: "/rerank"


# ================= Agent 设定 =================
agent:
  name: "晓达"
  description: "智能文博助手"

  system_template: |
    你是一个智能文博助手 {name}，专为博物馆场景设计，帮助用户了解展品、展览、服务和参观信息。

    【核心能力】
    你可以通过工具访问：
    - 文物藏品信息（搜索、推荐、详情查询）
    - 展览信息（当前展览、专题展览）
    - 服务设施（卫生间、电梯、休息区等）
    - 参观统计（人流量、热门展品等）
    - 文档资料（PDF、图片等）

    【工作模式】
    1. **知识问答**：根据知识库回答关于博物馆的基本问题
    2. **内容推荐**：根据用户兴趣推荐文物、展览或路线
    3. **信息查询**：查找特定展品、设施或服务信息
    4. **数据统计**：提供参观统计数据和分析
    5. **自然对话**：友好的闲聊和互动

    【回复规范】
    1. **简洁准确**：直接回答问题，避免冗余信息
    2. **结构清晰**：使用编号列表展示多个结果
    3. **数据准确**：基于工具返回的真实数据回答
    4. **友好礼貌**：保持专业且友好的语气

    【特殊情况处理】
    - 如果找不到相关信息，诚实告知用户并提供建议
    - 如果用户请求涉及敏感操作，等待用户批准
    - 如果需要更多信息才能帮助用户，主动询问


    现在，请根据用户的输入开始工作。


artifact_manager:
    enabled: true
    default_storage: hybrid    # memory, file, hybrid, database
    # 全局清理配置
    cleanup_interval: 3600
    ttl: 86400
    # 会话级别限制
    max_items_per_session: 50
    max_bytes_per_session: 52428800  # 50MB
    # 各存储类型的特定配置
    storage_configs:
      hybrid:
        memory_threshold: 10240
        file_threshold: 102400
        compression: true

# ================= 安全策略配置 =================
security:
  policy: "permissive"  # permissive=默认允许, strict=默认禁止

  # 敏感工具（需要人工审批）- 全局兜底配置
  sensitive_tools:
    - "write_file"
    - "delete_file"

# ================= 数据库配置 =================
database:
  # 数据库模式配置
  use_remote: true                  # 是否使用远程数据库
  remote_db_url: "http://192.168.11.11:9980/gzclabeldebugaapi"                  # 远程数据库 URL
  remote_db_api_key: null              # 远程数据库 API 密钥 (作为 token 使用)
  remote_db_timeout: 30                 # 远程数据库请求超时（秒）
  local_db_path: "agent_ultra.db"         # 本地数据库路径（use_remote=false 时使用）


# ================= Skills 配置 =================
# 独立的技能配置项，支持：
# - 启用/禁用技能
# - 每个技能的敏感工具配置（优先级高于全局 security.sensitive_tools）
skills_config:
  faq:
    enabled: true
    mode: "global"
    sensitive_tools: []

  file-manager:
    enabled: true
    mode: "global"
    sensitive_tools: ["write_file"]

  # 文博相关技能（启用）
  memory-local:
    enabled: true
    mode: "global"
    description: "长期记忆存储工具"
    sensitive_tools:
      - "delete_memory"   # 删除记忆需要审批

  # 统一的资源搜索技能（包含 V1 和 V2 API）
  asset_knowledge_search:
    enabled: true
    sensitive_tools: []


    
  calculator:
    enabled: true
    sensitive_tools: []

  clipboard:
    enabled: true
    mode: "global"
    sensitive_tools:
      - "clear_clipboard"  # 清空剪贴板需要审批


hooks_config:
    # FAQ 拦截 - 最高优先级
    faq_interceptor:
      enabled: true
      priority: 10
      hook_type: "filter"
      conditions:
        min_length: 2
        max_length: 200
      params:
        faq_tool_name: "query_faq"
      fail_on_error: false

    # 敏感词过滤 - 优先级 20
    sensitive_word_filter:
      enabled: true
      priority: 20
      hook_type: "filter"
      params:
        words: ["暴力", "恐怖", "色情"]
        action: "intercept"
        replacement: "***"

    # Prompt 注入检测 - 优先级 30
    prompt_injection_detector:
      enabled: true
      priority: 30
      hook_type: "validator"

    # 输入验证 - 优先级 50
    input_validator:
      enabled: true
      priority: 50
      hook_type: "validator"
      params:
        max_length: 5000
        min_length: 1

    # 请求日志 - 优先级 190
    request_logger:
      enabled: true
      priority: 190
      hook_type: "observer"
      params:
        log_level: "INFO"
        log_details: true

    # 统计收集 - 优先级 195
    statistics_collector:
      enabled: true
      priority: 195
      hook_type: "observer"

# ================= 意图定义 (Intents) =================
# 定义文博场景的业务意图和所需参数
# 意图执行时会调用 asset_knowledge_search 技能下的相应接口
intents:
  # ==================== 藏品相关意图 ====================

  # 意图1：搜索藏品（V2 API - 推荐）
  search_exhibits:
    description: "用户希望搜索文物或藏品。使用 V2 智能检索 API，支持语义搜索和自然语言理解。适用于：'找一些青铜器'、'战国的剑'、'玉器藏品'等。"
    slots:
      keywords:
        type: "str"
        description: "搜索关键词，如青铜器、剑、玉器等"
        required: true
      filters:
        type: "dict"
        description: "过滤条件，如 {era: '战国', material: '青铜'}"
        default: {}
      count:
        type: "int"
        description: "返回结果数量"
        default: 5

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：搜索藏品。
          已提取参数：
          - 关键词: "{keywords}"
          - 过滤条件: {filters}
          - 数量: {count}

          请调用 V2 API 工具 `search_exhibits_v2` 执行智能检索，该工具提供更好的语义搜索和重排序功能。
          根据返回的藏品信息，向用户介绍相关藏品。

  # 意图2：推荐文档/研究资料（V2 API - 推荐）
  search_documents:
    description: "用户希望查找文档资料或研究内容。使用 V2 智能检索 API，支持 LLM 生成的摘要。适用于：'青铜铸造工艺'、'汉代历史'、'研究资料'等。"
    slots:
      keywords:
        type: "str"
        description: "文档关键词或主题"
        required: true
      tags:
        type: "list"
        description: "标签过滤，如 ['研究', '论文', '历史']"
        default: []
      count:
        type: "int"
        description: "返回结果数量"
        default: 5

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：搜索文档资料。
          已提取参数：
          - 关键词: "{keywords}"
          - 标签: {tags}
          - 数量: {count}

          请调用 V2 API 工具 `search_resources_v2` 执行智能检索，该工具提供 LLM 生成的摘要和语义搜索功能。
          根据返回的文档摘要，向用户介绍相关资料。

  # ==================== 资产管理意图（V1 API） ====================

  # 意图3：精确资产搜索（V1 API）
  search_assets:
    description: "用户需要进行精确的资产搜索，指定了文件类型或资产类型。使用 V1 ES-based API。适用于：'找所有图片'、'搜索视频文件'、'查看专题库'等。"
    slots:
      keywords:
        type: "str"
        description: "搜索关键词"
        required: true
      types:
        type: "list"
        description: "搜索范围：['资产', '资产文件', '专题库']"
        default: ["资产", "资产文件"]
      resource_types:
        type: "list"
        description: "资源类型：['图片', '视频', '文档', '音频', '3D', '其他']"
        default: []

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：精确资产搜索。
          已提取参数：
          - 关键词: "{keywords}"
          - 搜索范围: {types}
          - 资源类型: {resource_types}

          请调用 V1 API 工具 `search_assets` 执行精确搜索，该工具支持按类型过滤。

  # 意图4：智能资产推荐（V1 API）
  recommend_assets:
    description: "用户的请求比较模糊或开放，希望获得推荐。使用 V1 推荐引擎。适用于：'推荐一些资源'、'有什么好东西'等。"
    slots:
      keywords:
        type: "str"
        description: "用户描述的关键词"
        required: true
      intent_targets:
        type: "list"
        description: "意图目标，如 ['文件', '资产', '专题库']"
        default: []

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【强制指令】必须调用 `recommend_assets` 工具

          用户意图：智能资产推荐
          关键词："{keywords}"
          目标类型：{intent_targets}

          【重要】你当前处于 asset_knowledge_search 技能模式，必须调用 `recommend_assets` 工具来执行推荐。
          不要调用 query_faq 或其他工具，直接调用 recommend_assets 即可。


  # ==================== 统计相关意图（V1 API） ====================

  # 意图6：查看资源统计
  view_statistics:
    description: "用户希望查看系统统计数据。适用于：'有多少资产？'、'最受欢迎的文件'、'统计数据'等。"
    slots:
      stat_type:
        type: "str"
        description: "统计类型：resource_library_count(总数), resource_top(Top排行), resource_count_by_type(按类型), resource_file_count_by_ext(按格式)等"
        required: true
      start_at:
        type: "str"
        description: "开始日期，格式 YYYY-MM-DD"
        default: "None"
      end_at:
        type: "str"
        description: "结束日期，格式 YYYY-MM-DD"
        default: "None"

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：查看资源统计。
          统计类型: "{stat_type}"
          时间范围: {start_at} 至 {end_at}

          请调用 V1 API 工具 `search_resource_statistic` 获取统计数据。

  # 意图7：知识图谱总览
  view_kg_overview:
    description: "用户希望了解知识图谱的整体情况。适用于：'知识图谱有多少实体？'、'图谱概况'等。"
    slots: {}

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：查看知识图谱总览。

          请调用 V1 API 工具 `search_kg_overview` 获取图谱统计信息。

  # 意图8：查询文档内容（需要已知文件ID）
  view_document:
    description: "用户提供了具体的文件ID，希望查看文档内容。适用于：'查看文件xxx的内容'等。"
    slots:
      file_ids:
        type: "str"
        description: "文件ID（单个或逗号分隔的多个）"
        required: true

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：查看文档内容。
          文件ID: "{file_ids}"

          请调用 V1 API 工具 `search_doc` 获取文档详细内容。

  # ==================== 其他意图 ====================

  # 意图9：查找服务设施
  find_service:
    description: "用户想找博物馆内的服务设施，如卫生间、电梯、休息区、餐厅等。"
    slots:
      facility_type:
        type: "str"
        description: "设施类型：toilet(卫生间)、elevator(电梯)、restaurant(餐厅)、rest_area(休息区)等"
        required: true
      floor:
        type: "int"
        description: "楼层限制"
        default: null
      location:
        type: "str"
        description: "位置偏好，如靠近入口、在东侧等"
        default: null

  # 意图10：查询展览信息
  query_exhibition:
    description: "用户想了解特定展览的信息，如展览内容、时间、地点等。"
    slots:
      exhibition_name:
        type: "str"
        description: "展览名称或关键词"
        required: true
      detail_type:
        type: "str"
        description: "需要的信息类型：overview(概览)、artifacts(展品列表)、schedule(时间安排)、location(位置)"
        default: "overview"

  # 意图11：路线规划
  plan_route:
    description: "用户希望规划参观路线，可能包含时间限制、兴趣偏好等。"
    slots:
      duration:
        type: "int"
        description: "预计参观时长（分钟）"
        default: 120
      interests:
        type: "list"
        description: "感兴趣的类别或主题"
        default: []
      accessibility:
        type: "bool"
        description: "是否需要无障碍路线"
        default: false
      start_point:
        type: "str"
        description: "起始点"
        default: "入口"

  # 意图12：通用闲聊
  general_chat:
    description: "用户只是打招呼、闲聊或没有明确的业务需求。"
    slots:
      question:
        type: "str"
        description: "用户的实际问题或问候内容"
        required: true
      emotion:
        type: "str"
        description: "识别的用户情绪：positive(积极)、neutral(中性)、negative(消极)、curious(好奇)"
        default: "neutral"

# ==================== 意图与工具映射说明 ====================
# V2 API（智能检索）：
#   - search_exhibits_v2: 搜索藏品（语义理解更好）
#   - search_resources_v2: 搜索文档/研究资料（带LLM摘要）
#
# V1 API（结构化查询）：
#   - search_assets: 精确资产搜索（支持类型过滤）
#   - recommend_assets: 智能资产推荐
#   - retrieve_knowledge: 知识图谱问答
#   - search_resource_statistic: 资源统计
#   - search_kg_overview: 知识图谱总览
#   - search_doc: 查询文档内容（需要文件ID）

# ================= 全局工具 =================
# 在任何状态下都能调用的通用工具
global_tools: []

# ================= 工具配置 =================
tools_config:
  # 敏感工具配置（会触发审批流程）
  delete_data:
    sensitive: true
  modify_data:
    sensitive: true
