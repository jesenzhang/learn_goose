# ================= 系统级配置 =================
system:
  memory_enabled: true   # 开启长期记忆 (Agent 会自动使用 save_memory/search_memory)
  timezone: "Asia/Shanghai"

# ================= 模型配置 =================
provider:
  llm:
    provider: "openai"
    config:
      # === 连接配置（构造参数）===
      model_name: "qwen3_vl"
      base_url: 'http://192.168.10.180:8088/v1'  # Provider 会自动处理末尾 /
      api_key_env: "OPENAI_API_KEY"
      timeout: 120.0
      max_retries: 5

      # === 推理配置（运行时参数）===
      temperature: 0.7
      max_tokens: null  # null = 使用模型默认值
      top_p: null
      frequency_penalty: null
      presence_penalty: null

  embedding:
    provider: "openai_embedding"
    config:
      base_url: http://192.168.10.137:8002

  reranker:
    provider: "openai"
    config:
      type: "openai"
      base_url: "http://192.168.10.137:8079"
      top_k: 5
      batch_size: 32
      route: "/rerank"


# ================= Agent 设定 =================
agent:
  name: "晓达"
  description: "智能文博助手"

  system_template: |
    你是一个智能文博助手 {name}，专为博物馆场景设计，帮助用户了解展品、展览、服务和参观信息。

    【核心能力】
    你可以通过工具访问：
    - 文物藏品信息（搜索、推荐、详情查询）
    - 展览信息（当前展览、专题展览）
    - 服务设施（卫生间、电梯、休息区等）
    - 参观统计（人流量、热门展品等）
    - 文档资料（PDF、图片等）

    【工作模式】
    1. **知识问答**：根据知识库回答关于博物馆的基本问题
    2. **内容推荐**：根据用户兴趣推荐文物、展览或路线
    3. **信息查询**：查找特定展品、设施或服务信息
    4. **数据统计**：提供参观统计数据和分析
    5. **自然对话**：友好的闲聊和互动

    【回复规范】
    1. **简洁准确**：直接回答问题，避免冗余信息
    2. **结构清晰**：使用编号列表展示多个结果
    3. **数据准确**：基于工具返回的真实数据回答
    4. **友好礼貌**：保持专业且友好的语气

    【特殊情况处理】
    - 如果找不到相关信息，诚实告知用户并提供建议
    - 如果用户请求涉及敏感操作，等待用户批准
    - 如果需要更多信息才能帮助用户，主动询问


    现在，请根据用户的输入开始工作。


artifact_manager:
    enabled: true
    default_storage: hybrid    # memory, file, hybrid, database
    # 全局清理配置
    cleanup_interval: 3600
    ttl: 86400
    # 会话级别限制
    max_items_per_session: 50
    max_bytes_per_session: 52428800  # 50MB
    # 各存储类型的特定配置
    storage_configs:
      hybrid:
        memory_threshold: 10240
        file_threshold: 102400
        compression: true

# ================= 安全策略配置 =================
security:
  policy: "permissive"  # permissive=默认允许, strict=默认禁止

  # 敏感工具（需要人工审批）- 全局兜底配置
  sensitive_tools:
    - "write_file"
    - "delete_file"

# ================= 数据库配置 =================
database:
  # 数据库模式配置
  use_remote: true                  # 是否使用远程数据库
  remote_db_url: "http://192.168.11.11:9980/gzclabeldebugaapi"                  # 远程数据库 URL
  remote_db_api_key: null              # 远程数据库 API 密钥 (作为 token 使用)
  remote_db_timeout: 30                 # 远程数据库请求超时（秒）
  local_db_path: "agent_ultra.db"         # 本地数据库路径（use_remote=false 时使用）


# ================= Skills 配置 =================
# 独立的技能配置项，支持：
# - 启用/禁用技能
# - 技能级别配置（mode, label, description）
# - 工具级别配置（tools_config，用于覆盖工具的显示名称等属性）
# - 每个技能的敏感工具配置（优先级高于全局 security.sensitive_tools）
skills_directory: "F:/Workspace/learn_goose/agent_skills"
skills_config:
  faq:
    enabled: true
    mode: "global"
    label: "常见问题"
    sensitive_tools: []
  
  planning-with-files:
    enabled: true

  file-manager:
    enabled: true
    mode: "global"
    label: "文件管理"
    sensitive_tools: ["write_file"]
    # 工具级别配置示例：覆盖工具的中文显示名称
    tools_config:
      list_files:
        label: "列出文件"
      read_file:
        label: "读取文件"
      write_file:
        label: "写入文件"

  # 文博相关技能（启用）
  memory-local:
    enabled: true
    mode: "global"
    label: "长期记忆"
    description: "长期记忆存储工具"
    sensitive_tools:
      - "delete_memory"   # 删除记忆需要审批
    # 工具级别配置示例
    tools_config:
      save_memory:
        label: "保存记忆"
      search_memory:
        label: "搜索记忆"
      delete_memory:
        label: "删除记忆"

  # 统一的资源搜索技能（包含 V1 和 V2 API）
  asset_knowledge_search:
    enabled: true
    label: "资源检索"
    sensitive_tools: []
    # 工具级别配置示例
    tools_config:
      search_exhibits_v2:
        label: "搜索藏品"
      search_resources_v2:
        label: "搜索文档"
      search_assets:
        label: "精确搜索"
      recommend_assets:
        label: "智能推荐"
      search_resource_statistic:
        label: "查询资源统计数据"
      search_kg_overview:
        label: "查询知识图谱概况"
      lookup_doc_content:
        label: "查看文档内容"
      page_content_qa:
        label: "当前页面问答"

  calculator:
    enabled: true
    label: "计算器"
    sensitive_tools: []
    # 工具级别配置示例
    tools_config:
      calculate:
        label: "计算"

  clipboard:
    enabled: true
    mode: "global"
    label: "剪贴板"
    sensitive_tools:
      - "clear_clipboard"  # 清空剪贴板需要审批
    # 工具级别配置示例
    tools_config:
      read_from_clipboard:
        label: "读取剪贴板"
      write_to_clipboard:
        label: "写入剪贴板"
      clear_clipboard:
        label: "清空剪贴板"


hooks_config:
    # FAQ 拦截 - 最高优先级
    faq_interceptor:
      enabled: true
      priority: 10
      hook_type: "filter"
      conditions:
        min_length: 2
        max_length: 200
      params:
        faq_tool_name: "query_faq"
      fail_on_error: false

    # 敏感词过滤 - 优先级 20
    sensitive_word_filter:
      enabled: true
      priority: 20
      hook_type: "filter"
      params:
        words: ["暴力", "恐怖", "色情"]
        action: "intercept"
        replacement: "***"

    # Prompt 注入检测 - 优先级 30
    prompt_injection_detector:
      enabled: true
      priority: 30
      hook_type: "validator"

    # 输入验证 - 优先级 50
    input_validator:
      enabled: true
      priority: 50
      hook_type: "validator"
      params:
        max_length: 5000
        min_length: 1

    # 请求日志 - 优先级 190
    request_logger:
      enabled: true
      priority: 190
      hook_type: "observer"
      params:
        log_level: "INFO"
        log_details: true

    # 统计收集 - 优先级 195
    statistics_collector:
      enabled: true
      priority: 195
      hook_type: "observer"

# ================= 意图定义 (Intents) =================
# 定义文博场景的业务意图和所需参数
# 意图执行时会调用 asset_knowledge_search 技能下的相应接口
intents:
  # ==================== 特殊通用意图 ====================

  # [新增] 自主执行意图 (The "Catch-All" Planner)
  # 当用户的需求不符合任何具体的 search/view 意图时，或者作为复合任务的后续步骤（如"然后写文章"）
  adhoc_execution:
    label: "自主执行"
    description: >
      用于处理意图列表中未明确定义的通用任务，例如：写作、总结、分析、推理、翻译、格式转换等。
      通常用于复合任务的第二步（例如：先搜索，然后【写文章】）。
    
    slots:
      instruction:
        type: "str"
        description: "具体的执行指令，越详细越好。例如：'基于搜索结果写一篇关于澳门的文章'"
        required: true
      context_source:
        type: "str"
        description: "依赖的上下文来源"
        default: "conversation_history"

    execution:
      mode: "llm"  # 这里使用 llm 模式，表示直接让 Agent 自由发挥
      # 不需要指定具体的 skill_name，或者指定为通用的 chat skill
      skill_name: "general" 
      skill_params:
        _instruction_template: >
          【自主执行指令】
          任务：{instruction}
          
          请利用当前的上下文（包括之前的 Tool 调用结果、shared_memory），尽你所能完成上述任务。
          你可以调用任何允许的工具（如 read_from_clipboard, write_file 等），或者直接生成文本回复。
  # ==================== 藏品相关意图 ====================

  # 意图1：搜索藏品（V2 API - 推荐）
  search_exhibits:
    label: "搜索藏品"
    description: "用户希望搜索文物或藏品。使用 V2 智能检索 API，支持语义搜索和自然语言理解。适用于：'找一些青铜器'、'战国的剑'、'玉器藏品'等。"
    slots:
      keywords:
        type: "str"
        description: "搜索关键词，如青铜器、剑、玉器等"
        required: true
      filters:
        type: "dict"
        description: "过滤条件，如 {era: '战国', material: '青铜'}"
        default: {}
      count:
        type: "int"
        description: "返回结果数量"
        default: 5

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：搜索藏品。
          已提取参数：
          - 关键词: "{keywords}"
          - 过滤条件: {filters}
          - 数量: {count}

          请调用 V2 API 工具 `search_exhibits_v2` 执行智能检索，该工具提供更好的语义搜索和重排序功能。
          根据返回的藏品信息，向用户介绍相关藏品。

  # 意图2：推荐文档/研究资料（V2 API - 推荐）
  search_documents:
    label: "推荐文档"
    description: "用户希望查找文档资料或研究内容。使用 V2 智能检索 API，支持 LLM 生成的摘要。适用于：'青铜铸造工艺'、'汉代历史'、'研究资料'等。"
    slots:
      keywords:
        type: "str"
        description: "文档关键词或主题"
        required: true
      tags:
        type: "list"
        description: "标签过滤，如 ['研究', '论文', '历史']"
        default: []
      count:
        type: "int"
        description: "返回结果数量"
        default: 5

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：搜索文档资料。
          已提取参数：
          - 关键词: "{keywords}"
          - 标签: {tags}
          - 数量: {count}

          请调用 V2 API 工具 `search_resources_v2` 执行智能检索，该工具提供 LLM 生成的摘要和语义搜索功能。
          根据返回的文档摘要，向用户介绍相关资料。

  # ==================== 资产管理意图（V1 API） ====================

  # 意图3：精确资产搜索（V1 API）
  search_assets:
    label: "精确资产搜索"
    description: "用户需要进行精确的资产搜索，指定了文件类型或资产类型。使用 V1 ES-based API。适用于：'找所有图片'、'搜索视频文件'、'查看专题库'等。"
    slots:
      keywords:
        type: "str"
        description: "搜索关键词"
        required: true
      types:
        type: "list"
        description: "搜索范围：['资产', '资产文件', '专题库']"
        default: ["资产", "资产文件"]
      resource_types:
        type: "list"
        # [关键修改] 增加映射逻辑说明
        description: >
          资源物理文件类型过滤。请根据用户描述进行映射：
          - 提到 "图片"、"照片"、"图"、"JPG"、"PNG" -> 映射为 '图片'
          - 提到 "视频"、"影片"、"录像"、"MP4" -> 映射为 '视频'
          - 提到 "文档"、"资料"、"文本"、"PDF"、"Word" -> 映射为 '文档'
          - 提到 "音频"、"声音"、"录音"、"MP3" -> 映射为 '音频'
          - 提到 "3D"、"模型"、"三维" -> 映射为 '3D'
          - 提到 "其他"、"压缩包" -> 映射为 '其他'
          
          注意：若用户未提及具体文件类型（如"搜索青铜器"），请保持为空列表（表示不过滤）。
        
        # 这里默认给空列表，通常后端逻辑是 空=全部
        default: []

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：精确资产搜索。
          已提取参数：
          - 关键词: "{keywords}"
          - 搜索范围: {types}
          - 资源类型: {resource_types}

          请调用 V1 API 工具 `search_assets` 执行精确搜索，该工具支持按类型过滤。

  # 意图4：智能资产推荐（V1 API）
  # 意图4：智能资产推荐（V1 API）
  recommend_assets:
    label: "智能资产推荐"
    description: >
      用户希望获得资源推荐，查询比较模糊或开放，或者包含多种跨类型的资源需求。
      适用于：'推荐一些关于龙的资源'、'看看有没有相关的视频和图片'、'找点好东西'等。
    slots:
      keywords:
        type: "str"
        description: "用户描述的关键词，提取核心实体或主题。"
        required: true
      
      intent_targets:
        type: "list"
        # [关键修改] 这里的描述变成了“映射指南”，指导 LLM 如何填槽
        description: >
          目标资源类型列表。请根据用户描述中的关键词进行严格映射：
          - 提到 "图片"、"照片"、"图"、"高清图" -> 映射为 '图片'
          - 提到 "视频"、"影像"、"片子" -> 映射为 '视频'
          - 提到 "文档"、"文章"、"资料"、"PDF" -> 映射为 '文档'
          - 提到 "音频"、"解说"、"声音" -> 映射为 '音频'
          - 提到 "3D"、"模型"、"三维" -> 映射为 '3D'
          - 提到 "专题"、"合集" -> 映射为 '专题库'
          - 提到 "文物"、"藏品"、"展品" -> 映射为 '藏品'
          - 提到 "文件"、"素材" -> 映射为 '资产'
          
          注意：
          1. 支持多选，如 "图片和视频" -> ['图片', '视频']
          2. 若用户未指定具体类型（如 "搜索青铜器"），请使用默认值（包含所有类型）。
        
        # 默认包含所有，确保不漏
        default: ['图片','视频','文档','音频','3D','其他','专题库','资产','藏品']
      
      # [2] 新增：资源类型精准过滤 (专门用于 V1 资产的过滤)
      resource_types:
        type: "list"
        description: >
          物理文件类型过滤（用于精确筛选资产）。请根据关键词映射：
          - 提到 "图片"、"照片"、"高清图" -> 映射为 '图片'
          - 提到 "视频"、"影片"、"录像" -> 映射为 '视频'
          - 提到 "文档"、"PDF"、"资料" -> 映射为 '文档'
          - 提到 "音频"、"解说" -> 映射为 '音频'
          - 提到 "3D"、"模型" -> 映射为 '3D'
          
          注意：如果用户未明确指定“文件格式”或“类型”，请保持为空列表 []，表示不过滤。
        default: []


    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【强制指令】必须调用 `recommend_assets` 工具

          用户意图：智能资产推荐
          关键词："{keywords}"
          目标类型：{intent_targets}
          资源类型过滤：{resource_types}

          【执行逻辑】
          1. 你当前处于多路召回模式。
          2. 请直接调用 `recommend_assets`，将提取到的 `keywords`、`intent_targets`、`resource_types` 列表准确传入。
          3. 工具会根据类型自动从 藏品库(V2)、资源库(V2) 和 资产库(V1) 中聚合结果。


  # ==================== 统计相关意图（V1 API） ====================

  # 意图6：查看资源统计
  view_statistics:
    label: "查看资源统计"
    description: "用户希望查看系统统计数据。适用于：'有多少资产？'、'最受欢迎的文件'、'统计数据'等。"
    slots:
      stat_type:
        type: "str"
        description: "统计类型：resource_library_count(总数), resource_top(Top排行), resource_count_by_type(按类型), resource_file_count_by_ext(按格式)等"
        required: true
      start_at:
        type: "str"
        description: "开始日期，格式 YYYY-MM-DD"
        default: "None"
      end_at:
        type: "str"
        description: "结束日期，格式 YYYY-MM-DD"
        default: "None"

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：查看资源统计。
          统计类型: "{stat_type}"
          时间范围: {start_at} 至 {end_at}

          请调用 V1 API 工具 `search_resource_statistic` 获取统计数据。

  # 意图7：知识图谱总览
  view_kg_overview:
    label: "知识图谱总览"
    description: "用户希望了解知识图谱的整体情况。适用于：'知识图谱有多少实体？'、'图谱概况'等。"
    slots: {}

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：查看知识图谱总览。

          请调用 V1 API 工具 `search_kg_overview` 获取图谱统计信息。

  # 意图8：查询文档内容（需要已知文件ID）
    
  view_document:
    label: "查询文档内容"
    description: "用户提供了具体的文件ID，希望查看文档内容。适用于：'查看文件xxx的内容'等。"
    slots:
      file_ids:
        type: "str"
        description: "文件ID（单个或逗号分隔的多个）"
        required: true

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：查看文档内容。
          文件ID: "{file_ids}"

          请调用 V1 API 工具 `search_doc` 获取文档详细内容。

  # 意图9：对当前页面内容提问
  page_content_qa:
    label: "当前页面问答"
    # [关键修改]：
    # 1. 移除 shared_memory 等技术细节，改用自然语言描述用户行为。
    # 2. 增加 explicit examples (示例)，覆盖不同的提问方式。
    description: >
      用户希望针对“当前正在浏览的页面”、“当前网页”或“当前文档”的内容进行提问、总结或提取信息。
      当用户提到“当前页面”、“这个网页”、“这篇文章”、“页面内容”等关键词，或者要求“总结”、“概括”当前显示的内容时触发。
      
      示例用户输入：
      - "当前页面讲的是什么内容？"
      - "简述当前页面的内容"
      - "总结一下这个网页的要点"
      - "这个页面里提到了哪些价格信息？"
      - "分析一下当前文章的观点"
    keywords: ["当前页面", "这个网页", "网页内容", "页面内容", "文章讲了什么"]
    slots: {}

    execution:
      mode: "skill"
      skill_name: "asset_knowledge_search"
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：当前页面问答。
          
          上下文提示：用户的输入是针对浏览器当前页面的内容。
          请务必执行以下步骤：
          1. 调用工具 `page_content_qa` 读取 当前页面的内容。
          2. 基于读取到的文本内容，回答用户的问题。
          3. 如果读取内容为空，请告知用户无法获取页面内容。

  # 意图12：通用闲聊
  general_chat:
    label: "通用闲聊"
    description: > 
      仅用于纯粹的打招呼（你好）、情感表达（太棒了）或与博物馆业务完全无关的闲聊。
      【绝对禁止】：如果用户提到任何具体的文物、历史、文件、统计数据或页面内容，必须分发给对应的具体意图，绝对不能归类为 general_chat。
      
    slots:
      question:
        type: "str"
        description: "用户的实际问题或问候内容"
        required: true
      emotion:
        type: "str"
        description: "识别的用户情绪：positive(积极)、neutral(中性)、negative(消极)、curious(好奇)"
        default: "neutral"



# ==================== 意图与工具映射说明 ====================
# V2 API（智能检索）：
#   - search_exhibits_v2: 搜索藏品（语义理解更好）
#   - search_resources_v2: 搜索文档/研究资料（带LLM摘要）
#
# V1 API（结构化查询）：
#   - search_assets: 精确资产搜索（支持类型过滤）
#   - recommend_assets: 智能资产推荐
#   - retrieve_knowledge: 知识图谱问答
#   - search_resource_statistic: 资源统计
#   - search_kg_overview: 知识图谱总览
#   - search_doc: 查询文档内容（需要文件ID）

# ================= 全局工具 =================
# 在任何状态下都能调用的通用工具
global_tools: []

# ================= 工具配置 =================
tools_config:
  # 敏感工具配置（会触发审批流程）
  delete_data:
    sensitive: true
  modify_data:
    sensitive: true
