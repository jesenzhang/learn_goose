# ================= 系统级配置 =================
system:
  memory_enabled: true   # 开启长期记忆 (Agent 会自动使用 save_memory/search_memory)
  timezone: "Asia/Shanghai"

# ================= 模型配置 =================
provider:
  llm:
    provider: "openai"
    config:
      # === 连接配置（构造参数）===
      model_name: "qwen3_vl"
      base_url: 'http://192.168.10.180:8088/v1'  # Provider 会自动处理末尾 /
      api_key_env: "OPENAI_API_KEY"
      timeout: 120.0
      max_retries: 5

      # === 推理配置（运行时参数）===
      temperature: 0.7
      max_tokens: null  # null = 使用模型默认值
      top_p: null
      frequency_penalty: null
      presence_penalty: null

  embedding:
    provider: "openai_embedding"
    config:
      base_url: http://192.168.10.137:8002

  reranker:
    provider: "openai"
    config:
      type: "openai"
      base_url: "http://192.168.10.137:8079"
      top_k: 5
      batch_size: 32
      route: "/rerank"


# ================= Agent 设定 =================
agent:
  name: "晓达"
  description: "智能文博助手"

  system_template: |
    你是一个智能文博助手 {name}，专为博物馆场景设计，帮助用户了解展品、展览、服务和参观信息。

    【核心能力】
    你可以通过工具访问：
    - 文物藏品信息（搜索、推荐、详情查询）
    - 展览信息（当前展览、专题展览）
    - 服务设施（卫生间、电梯、休息区等）
    - 参观统计（人流量、热门展品等）
    - 文档资料（PDF、图片等）

    【工作模式】
    1. **知识问答**：根据知识库回答关于博物馆的基本问题
    2. **内容推荐**：根据用户兴趣推荐文物、展览或路线
    3. **信息查询**：查找特定展品、设施或服务信息
    4. **数据统计**：提供参观统计数据和分析
    5. **自然对话**：友好的闲聊和互动

    【回复规范】
    1. **简洁准确**：直接回答问题，避免冗余信息
    2. **结构清晰**：使用编号列表展示多个结果
    3. **数据准确**：基于工具返回的真实数据回答
    4. **友好礼貌**：保持专业且友好的语气

    【特殊情况处理】
    - 如果找不到相关信息，诚实告知用户并提供建议
    - 如果用户请求涉及敏感操作，等待用户批准
    - 如果需要更多信息才能帮助用户，主动询问

    现在，请根据用户的输入开始工作。



# ================= 安全策略配置 =================
security:
  policy: "permissive"  # permissive=默认允许, strict=默认禁止

  # 敏感工具（需要人工审批）- 全局兜底配置
  sensitive_tools:
    - "write_file"
    - "delete_file"


# ================= Skills 配置 =================
# 独立的技能配置项，支持：
# - 启用/禁用技能
# - 每个技能的敏感工具配置（优先级高于全局 security.sensitive_tools）
skills_config:
  file-manager:
    enabled: true
    mode: "global"
    sensitive_tools: ["write_file"]

  # 文博相关技能（启用）
  memory-local:
    enabled: true
    description: "长期记忆存储工具"
    sensitive_tools:
      - "delete_memory"   # 删除记忆需要审批

  asset-search:
    enabled: true
    sensitive_tools: []

  faq:
    enabled: true
    sensitive_tools: []

  calculator:
    enabled: true
    sensitive_tools: []

  clipboard:
    enabled: true
    sensitive_tools:
      - "clear_clipboard"  # 清空剪贴板需要审批

  # 系统工具（禁用 - 与文博场景无关）
  system-health:
    enabled: false

  docx:
    enabled: false

  pdf:
    enabled: false

  xlsx:
    enabled: false

  pptx:
    enabled: false

  collection-query:
    enabled: false


# ================= 意图定义 (Intents) =================
# 定义文博场景的业务意图和所需参数
intents:
  # 意图1：推荐文物藏品
  recommend_exhibits:
    description: "用户希望获得文物或藏品推荐。可能包含特征描述（如红色的、古代的、打仗用的）或模糊需求（如好看的、珍贵的）。"
    slots:
      category:
        type: "str"
        description: "类别筛选：exhibits(展品)、artifacts(文物)、relics(遗物)"
        default: "exhibits"
      keywords:
        type: "str"
        description: "用户描述的关键词，如红色、古代、兵器等"
        required: true
      features:
        type: "list"
        description: "提取的特征形容词列表"
        default: []
      count:
        type: "int"
        description: "需要的数量"
        default: 5

    execution:
      mode: "skill"
      skill_name: "asset-search" # 切换到这个技能
      
      # [核心配置] 这里定义的参数会被注入到 shared_memory
      # 我们约定以 "_instruction_" 开头的参数用于生成系统指令
      skill_params:
        _instruction_template: >
          【系统指令】
          用户意图：寻找藏品。
          已提取参数：
          - 关键词: "{keywords}"
          - 分类: "{category}"
          - 特征: {features}
          - 数量: {count}
          
          请直接调用 `asset-search` 技能下的工具（如 search_exhibits）执行搜索，并根据结果回答用户。

          
  # 意图2：推荐文档资料
  recommend_documents:
    description: "用户希望查找或推荐相关的文档资料，如PDF、图片、视频等。"
    slots:
      keywords:
        type: "str"
        description: "文档关键词或主题"
        required: true
      doc_type:
        type: "str"
        description: "文档类型：pdf, image, video, all"
        default: "all"
      count:
        type: "int"
        description: "需要的数量"
        default: 5

  # 意图3：查找服务设施
  find_service:
    description: "用户想找博物馆内的服务设施，如卫生间、电梯、休息区、餐厅等。"
    slots:
      facility_type:
        type: "str"
        description: "设施类型：toilet(卫生间)、elevator(电梯)、restaurant(餐厅)、rest_area(休息区)等"
        required: true
      floor:
        type: "int"
        description: "楼层限制"
        default: null
      location:
        type: "str"
        description: "位置偏好，如靠近入口、在东侧等"
        default: null

  # 意图4：查看统计数据
  view_statistics:
    description: "用户希望查看参观统计数据，如人流量、热门展品、停留时间等。"
    slots:
      stat_type:
        type: "str"
        description: "统计类型：visitor_flow(人流)、popular_exhibits(热门展品)、dwell_time(停留时间)等"
        required: true
      time_range:
        type: "str"
        description: "时间范围：today(今天)、week(本周)、month(本月)、all(全部)"
        default: "today"

  # 意图5：查询展览信息
  query_exhibition:
    description: "用户想了解特定展览的信息，如展览内容、时间、地点等。"
    slots:
      exhibition_name:
        type: "str"
        description: "展览名称或关键词"
        required: true
      detail_type:
        type: "str"
        description: "需要的信息类型：overview(概览)、artifacts(展品列表)、schedule(时间安排)、location(位置)"
        default: "overview"

  # 意图6：路线规划
  plan_route:
    description: "用户希望规划参观路线，可能包含时间限制、兴趣偏好等。"
    slots:
      duration:
        type: "int"
        description: "预计参观时长（分钟）"
        default: 120
      interests:
        type: "list"
        description: "感兴趣的类别或主题"
        default: []
      accessibility:
        type: "bool"
        description: "是否需要无障碍路线"
        default: false
      start_point:
        type: "str"
        description: "起始点"
        default: "入口"

  # 意图7：通用闲聊
  general_chat:
    description: "用户只是打招呼、闲聊或没有明确的业务需求。"
    slots:
      question:
        type: "str"
        description: "用户的实际问题或问候内容"
        required: true
      emotion:
        type: "str"
        description: "识别的用户情绪：positive(积极)、neutral(中性)、negative(消极)、curious(好奇)"
        default: "neutral"

# ================= 全局工具 =================
# 在任何状态下都能调用的通用工具
global_tools: []

# ================= 工具配置 =================
tools_config:
  # 敏感工具配置（会触发审批流程）
  delete_data:
    sensitive: true
  modify_data:
    sensitive: true
