base_url: "http://192.168.11.11:9980/gzclabelapi"

global_headers:
  User-Agent: "MyApp/1.0"
  Accept: "application/json"

retry_config:
  max_retries: 3
  retry_delay: 0.5

endpoints:
  # 1. GET 请求，带 Query 参数
  - name: "search_doc"
    path: "/agent/search_doc"
    method: "POST"
    description: "检索文档"
    default_params:
        p: "w"
    timeout: 5

  # 2. GET 请求，带路径参数 {id}
  - name: "get_user_detail"
    path: "/users/{user_id}"
    method: "GET"
    description: "获取特定用户详情"

  # 3. POST 请求，创建资源
  - name: "create_order"
    path: "/orders"
    method: "POST"
    description: "创建新订单"
    default_headers:
      Content-Type: "application/json"

  # 4. PATCH 请求，更新状态
  - name: "update_status"
    path: "/orders/{order_id}/status"
    method: "PATCH"